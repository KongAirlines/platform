name: Sync shared Konnect foundations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-foundations.yaml
      - konnect/access.yaml
      - konnect/development-gateway.yaml
      - konnect/foundations.yaml
      - gateway/dev/ace.yaml
      - gateway/dev/jwt-consumers.yaml

permissions:
  contents: read

concurrency:
  group: platform-foundations
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install kongctl
        uses: Kong/setup-kongctl@659d5c2b0f4db2e25d63797035358a22907421db # v1
      - name: Install decK
        uses: Kong/setup-deck@6ea0a466ee5826ddb531cbe851ba8e5a77a0e041 # v1
        with:
          deck-version: "1.65.2"
          wrapper: false
      - name: Restore service automation access
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_TOKEN }}
        run: |
          # Nested system-account memberships selected with !lookup are
          # incorrectly deleted by sync: https://github.com/Kong/kongctl/issues/2534
          kongctl apply -f konnect/access.yaml \
            --auto-approve \
            --require-namespace platform
      - name: Sync foundations
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_TOKEN }}
        run: |
          kongctl sync -f konnect/foundations.yaml \
            --auto-approve \
            --require-namespace platform
          # kongctl currently drops file-level namespace defaults when all
          # parent resources are _external, so enforcement rejects this
          # otherwise valid _deck-only plan.
          kongctl sync -f konnect/development-gateway.yaml --base-dir . \
            --auto-approve
