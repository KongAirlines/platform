name: Sync production Gateway state

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - gateway/prod/**
      - konnect/production-gateway.yaml

permissions:
  contents: read

concurrency:
  group: production-gateway
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Install kongctl
        uses: Kong/setup-kongctl@659d5c2b0f4db2e25d63797035358a22907421db # v1
      - name: Install decK
        uses: Kong/setup-deck@6ea0a466ee5826ddb531cbe851ba8e5a77a0e041 # v1
        with:
          deck-version: "1.65.2"
          wrapper: false
      - name: Lint production Gateway inputs before synchronization
        run: |
          deck file lint --analytics=false --state gateway/prod/ace.yaml lint/ace-prod.yaml
          for artifact in bookings customer-information destinations flights; do
            deck file lint --analytics=false --state "gateway/prod/${artifact}.yaml" lint/promoted-gateway.yaml
          done
      - name: Sync aggregate production Gateway state
        env:
          KONGCTL_DEFAULT_KONNECT_PAT: ${{ secrets.KONNECT_TOKEN }}
        run: |
          ruby scripts/validate-production-gateway-scope.rb
          # kongctl currently drops file-level namespace defaults when all
          # parent resources are _external, so enforcement rejects this
          # otherwise valid _deck-only plan.
          kongctl sync -f konnect/production-gateway.yaml --base-dir . \
            --auto-approve
      - name: Generate Catalog dispatch token
        if: github.event_name == 'push'
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.REFERENCE_PLATFORM_APP_CLIENT_ID }}
          private-key: ${{ secrets.REFERENCE_PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            bookings
            customer
            destinations
            flights
          permission-actions: write
      - name: Dispatch production Catalog synchronization
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          while IFS=$'\t' read -r repository source_commit; do
            [[ -n "${repository}" ]] || continue
            gh workflow run apply-prod-catalog.yaml \
              --repo "${repository}" \
              --ref main \
              -f "source_commit=${source_commit}"
            echo "- Dispatched ${repository}@${source_commit}" >> "${GITHUB_STEP_SUMMARY}"
          done < <(
            ./scripts/list-production-catalog-dispatches.sh \
              "${BASE_SHA}" "${GITHUB_SHA}"
          )
