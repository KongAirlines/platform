name: Validate platform desired state

on:
  pull_request:
    paths:
      - .github/workflows/**
      - gateway/**
      - konnect/**
      - lint/**
      - scripts/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install kongctl
        uses: Kong/setup-kongctl@659d5c2b0f4db2e25d63797035358a22907421db # v1; latest stable
      - name: Install decK
        uses: Kong/setup-deck@6ea0a466ee5826ddb531cbe851ba8e5a77a0e041 # v1
        with:
          deck-version: "1.65.2"
          wrapper: false
      - name: Test native lint policies
        run: python3 scripts/test-lint-policies.py
      - name: Lint Konnect and Gateway manifests
        run: bash scripts/lint-manifests.sh
      - name: Validate promoted Gateway state
        run: |
          deck file validate gateway/dev/ace.yaml
          deck file validate gateway/prod/ace.yaml
          deck file validate gateway/prod/bookings.yaml
          deck file validate gateway/prod/customer-information.yaml
          deck file validate gateway/prod/destinations.yaml
          deck file validate gateway/prod/flights.yaml
      - name: Validate aggregate rendering
        run: |
          ruby scripts/validate-development-gateway-scope.rb
          deck file render --format json \
            gateway/prod/ace.yaml \
            gateway/prod/bookings.yaml \
            gateway/prod/customer-information.yaml \
            gateway/prod/destinations.yaml \
            gateway/prod/flights.yaml \
            --output-file "${RUNNER_TEMP}/kongairlines-production-gateway.json"
          ruby scripts/validate-production-gateway-scope.rb \
            "${RUNNER_TEMP}/kongairlines-production-gateway.json"
      - name: Validate ownership and provenance
        run: ./scripts/validate-reference-platform.sh
      - name: Validate automation and Portal content
        run: |
          bash -n scripts/*.sh
          node scripts/validate-portal-branding.js
          ruby scripts/validate-portal-content.rb
