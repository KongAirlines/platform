name: Verify Gateway authentication

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment and Gateway credential scope
        required: true
        type: choice
        options:
          - development
          - production
      gateway_url:
        description: Public proxy URL without a trailing path
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify Portal application access and demo account isolation
        env:
          KONGAIRLINES_TEST_API_KEY: ${{ secrets.KONGAIRLINES_TEST_API_KEY }}
          KONGAIRLINES_SECOND_API_KEY: ${{ secrets.KONGAIRLINES_SECOND_API_KEY }}
          KONGAIRLINES_UNREGISTERED_API_KEY: ${{ secrets.KONGAIRLINES_UNREGISTERED_API_KEY }}
          KONGAIRLINES_GATEWAY_URL: ${{ inputs.gateway_url }}
        run: |
          ./scripts/verify-gateway-auth.sh
