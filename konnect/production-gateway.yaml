_defaults:
  kongctl:
    namespace: platform

control_planes:
  - ref: kongairlines-prod
    _external:
      selector:
        matchFields:
          name: kongairlines-prod
    _deck:
      # These files form one reconciliation unit with the same env-prod selector.
      files:
        - ../gateway/prod/ace.yaml
        - ../gateway/prod/jwt-consumers.yaml
        - ../gateway/prod/bookings.yaml
        - ../gateway/prod/customer-information.yaml
        - ../gateway/prod/destinations.yaml
        - ../gateway/prod/flights.yaml
      flags:
        - --analytics=false
