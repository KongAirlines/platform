_defaults:
  kongctl:
    namespace: platform

organization:
  teams:
    - ref: customer-data-team
      name: customer-data
      description: Owns the Bookings and Customer Information APIs.
      labels:
        owner: customer-data
      roles:
        - ref: customer-data-api-creator
          role_name: Creator
          entity_id: "*"
          entity_type_name: APIs
          entity_region: "*"
        - ref: customer-data-api-admin
          role_name: Admin
          entity_id: "*"
          entity_type_name: APIs
          entity_region: "*"
        - ref: customer-data-api-publisher
          role_name: Publisher
          entity_id: "*"
          entity_type_name: APIs
          entity_region: "*"
        - ref: customer-data-portal-viewer
          role_name: Viewer
          entity_id: "*"
          entity_type_name: Portals
          entity_region: "*"
        - ref: customer-data-auth-strategy-viewer
          role_name: Viewer
          entity_id: "*"
          entity_type_name: Application Auth Strategies
          entity_region: "*"
        - ref: customer-data-dev-deployer
          role_name: Deployer
          entity_id: !ref customer-data-dev#id
          entity_type_name: Control Planes
          entity_region: us
        - ref: customer-data-control-plane-viewer
          role_name: Viewer
          entity_id: "*"
          entity_type_name: Control Planes
          entity_region: us
    - ref: flight-data-team
      name: flight-data
      description: Owns the Destinations and Flights APIs.
      labels:
        owner: flight-data
      roles:
        - ref: flight-data-api-creator
          role_name: Creator
          entity_id: "*"
          entity_type_name: APIs
          entity_region: "*"
        - ref: flight-data-api-admin
          role_name: Admin
          entity_id: "*"
          entity_type_name: APIs
          entity_region: "*"
        - ref: flight-data-api-publisher
          role_name: Publisher
          entity_id: "*"
          entity_type_name: APIs
          entity_region: "*"
        - ref: flight-data-portal-viewer
          role_name: Viewer
          entity_id: "*"
          entity_type_name: Portals
          entity_region: "*"
        - ref: flight-data-auth-strategy-viewer
          role_name: Viewer
          entity_id: "*"
          entity_type_name: Application Auth Strategies
          entity_region: "*"
        - ref: flight-data-dev-deployer
          role_name: Deployer
          entity_id: !ref flight-data-dev#id
          entity_type_name: Control Planes
          entity_region: us
        - ref: flight-data-control-plane-viewer
          role_name: Viewer
          entity_id: "*"
          entity_type_name: Control Planes
          entity_region: us

control_planes:
  - ref: customer-data-dev
    name: customer-data-dev
    description: Development Gateway configuration owned by customer-data.
    cluster_type: CLUSTER_TYPE_CONTROL_PLANE
    labels:
      environment: development
      owner: customer-data
  - ref: flight-data-dev
    name: flight-data-dev
    description: Development Gateway configuration owned by flight-data.
    cluster_type: CLUSTER_TYPE_CONTROL_PLANE
    labels:
      environment: development
      owner: flight-data
  - ref: kongairlines-prod
    name: kongairlines-prod
    description: Shared production Gateway governed by the Platform Team.
    cluster_type: CLUSTER_TYPE_CONTROL_PLANE
    labels:
      environment: production
      owner: platform

application_auth_strategies:
  - ref: kongairlines-key-auth-dev
    name: kongairlines-key-auth-dev
    display_name: KongAirlines Development API Key
    strategy_type: key_auth
    configs:
      key_auth:
        key_names:
          - X-API-Key
    labels:
      environment: development
      owner: platform
  - ref: kongairlines-key-auth-prod
    name: kongairlines-key-auth-prod
    display_name: KongAirlines Production API Key
    strategy_type: key_auth
    configs:
      key_auth:
        key_names:
          - X-API-Key
    labels:
      environment: production
      owner: platform

portals:
  - ref: kongairlines-development
    name: KongAirlines Development
    default_application_auth_strategy_id: !ref kongairlines-key-auth-dev#id
    display_name: KongAirlines Development
    description: Private portal for pre-production API consumers.
    authentication_enabled: true
    rbac_enabled: true
    auto_approve_developers: false
    auto_approve_applications: false
    default_api_visibility: private
    default_page_visibility: private
    assets: !file branding/assets.json
    customization:
      ref: kongairlines-development-branding
      css: !file branding/portal.css
      theme: !file branding/theme.json
      menu: !file portal/menu.json
    pages:
      - ref: development-page-home
        slug: "/"
        title: Welcome to KongAir
        visibility: private
        status: published
        content: !file portal/pages/home.md
      - ref: development-page-apis
        slug: "apis"
        title: API catalog
        visibility: private
        status: published
        content: !file portal/pages/apis.md
      - ref: development-page-guides
        slug: "guides"
        title: Developer guides
        visibility: private
        status: published
        content: !file portal/pages/guides.md
        children:
          - ref: development-guide-getting-started
            slug: getting-started
            title: Getting started
            visibility: private
            status: published
            content: !file portal/pages/guides/getting-started.md
          - ref: development-guide-application-access
            slug: application-access
            title: Application access
            visibility: private
            status: published
            content: !file portal/pages/guides/application-access.md
          - ref: development-guide-environments
            slug: environments
            title: Environments and versions
            visibility: private
            status: published
            content: !file portal/pages/guides/environments.md
      - ref: development-page-about
        slug: "about"
        title: About KongAir
        visibility: private
        status: published
        content: !file portal/pages/about.md
    snippets:
      - ref: development-guides-navigation
        name: guides-navigation
        visibility: private
        status: published
        content: !file portal/snippets/guides-navigation.md
      - ref: development-guides-sections
        name: guides-sections
        visibility: private
        status: published
        content: !file portal/snippets/guides-sections.md
    labels:
      environment: development
      owner: platform
  - ref: kongairlines-production
    name: KongAirlines Production
    default_application_auth_strategy_id: !ref kongairlines-key-auth-prod#id
    display_name: KongAirlines
    description: Public portal for KongAirlines production APIs.
    authentication_enabled: true
    rbac_enabled: false
    auto_approve_developers: false
    auto_approve_applications: false
    default_api_visibility: public
    default_page_visibility: public
    assets: !file branding/assets.json
    customization:
      ref: kongairlines-production-branding
      css: !file branding/portal.css
      theme: !file branding/theme.json
      menu: !file portal/menu.json
    pages:
      - ref: production-page-home
        slug: "/"
        title: Welcome to KongAir
        visibility: public
        status: published
        content: !file portal/pages/home.md
      - ref: production-page-apis
        slug: "apis"
        title: API catalog
        visibility: public
        status: published
        content: !file portal/pages/apis.md
      - ref: production-page-guides
        slug: "guides"
        title: Developer guides
        visibility: public
        status: published
        content: !file portal/pages/guides.md
        children:
          - ref: production-guide-getting-started
            slug: getting-started
            title: Getting started
            visibility: public
            status: published
            content: !file portal/pages/guides/getting-started.md
          - ref: production-guide-application-access
            slug: application-access
            title: Application access
            visibility: public
            status: published
            content: !file portal/pages/guides/application-access.md
          - ref: production-guide-environments
            slug: environments
            title: Environments and versions
            visibility: public
            status: published
            content: !file portal/pages/guides/environments.md
      - ref: production-page-about
        slug: "about"
        title: About KongAir
        visibility: public
        status: published
        content: !file portal/pages/about.md
    snippets:
      - ref: production-guides-navigation
        name: guides-navigation
        visibility: public
        status: published
        content: !file portal/snippets/guides-navigation.md
      - ref: production-guides-sections
        name: guides-sections
        visibility: public
        status: published
        content: !file portal/snippets/guides-sections.md
    labels:
      environment: production
      owner: platform
